openapi: 3.0.0
info:
  title: SAVR API
  description: A clean, modular API layout using external file references.
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  # Authentication
  /auth/login:
    $ref: "./auth/requests/login.yaml"

  /auth/register:
    $ref: "./auth/requests/register.yaml"

  #   # Profile
  #   /profile:
  #     $ref: "./profile/requests/profile.yaml"
  #
  #   # Budgetting
  #   /budget/overview:
  #     $ref: "./budget/requests/overview.yaml"
  #
  #   /budget/categories:
  #     $ref: "./budget/requests/categories.yaml"
  #
  #   /budget/categories/{categoryId}:
  #     $ref: "./budget/requests/category.yaml"
  #
  #   /budget/categories/{categoryId}/expenses:
  #     $ref: "./budget/requests/expenses.yaml"
  #
  #   /budget/categories/{categoryId}/expenses/{expenseId}:
  #     $ref: "./budget/requests/expense.yaml"
  #
  # Spending tracker
  /transactions:
    $ref: "./transactions/requests/transactions.yaml"

  /transactions/stats:
    $ref: "./transactions/requests/transactions-stats.yaml"

  /transactions/{transactionId}:
    $ref: "./transactions/requests/transaction.yaml"
