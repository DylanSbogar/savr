delete:
  description: Delete a transaction
  operationId: deleteTransaction

  parameters:
    - name: transactionId
      description: The unique identifier of the transaction.
      in: path
      schema:
        type: string
        format: uuid
      required: true

  responses:
    "204":
      description: The transaction has been successfully deleted.
