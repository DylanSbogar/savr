get:
  description: Retrieve a transaction
  operationId: getTransaction

  parameters:
    - name: transactionId
      description: The unique identifier of the transaction.
      in: path
      schema:
        type: string
        format: uuid
      required: true

  responses:
    "200":
      description: The details of the requested transaction.
      content:
        application/json:
          schema:
            $ref: "../schemas/transaction-detail.yaml"

