get:
  description: Get spending totals for a date range
  operationId: getTransactionStats

  parameters:
    - name: from
      in: query
      required: true
      description: Start of the range (inclusive).
      schema:
        type: string
        format: date-time

    - name: to
      in: query
      required: true
      description: End of the range (exclusive).
      schema:
        type: string
        format: date-time

  responses:
    "200":
      description: Stats for the range.
      content:
        application/json:
          schema:
            $ref: "../schemas/transaction-stats.yaml"
    "400":
      description: Invalid range.
