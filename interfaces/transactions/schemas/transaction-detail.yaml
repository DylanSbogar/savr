type: object
description: A singular transaction item.
required: [id, name, dateTime, amount]

properties:
  id:
    type: string
    format: uuid
    readOnly: true
    description: The unique identifier of the transaction.

  name:
    type: string
    description: The displayable name of the transaction.
    maxLength: 255

  dateTime:
    type: string
    description: The date and time the transaction took place.
    format: date-time

  amount:
    type: number
    format: double
    description: The cost of the transaction.
    example: "19.99"

  vendor:
    type: string
    description: The vendor the transaction took place at.
    maxLength: 255

  location:
    type: string
    description: Latitude and longitude in decimal degrees as "lat,lng" (e.g. "-37.8136,144.9631"). Used to populate a map pin.
    example: "-37.8136,144.9631"

  notes:
    type: string
    description: Any additional notes about the transaction.
    maxLength: 1000
