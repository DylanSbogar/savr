type: object
required: [name, dateTime, amount]

properties:
  name:
    type: string
    description: The name of the transaction.
    example: ""

  dateTime:
    type: string
    format: date-time
    description: The date and time the transaction took place.
    example: ""

  amount:
    type: number
    format: double
    description: The cost of the transaction.
    example: "19.99"

  vendor:
    type: string
    maxLength: 255
    description: The vendor the transaction took place at.
    example: ""

  location:
    type: string
    description: Latitude and longitude in decimal degrees.
    example: "-37.8136,144.9631"

  notes:
    type: string
    maxLength: 1000
    description: Any additional notes about the transaction.
    example: ""
